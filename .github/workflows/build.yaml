name: Build

on:
  push:
    branches: [master]

  pull_request:

# A newer push to the same branch makes the running deploy obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.11
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm dlx audit-ci@^7 --config ./.audit-ci.jsonc

      - name: Run tests
        run: pnpm run --if-present test

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run typecheck

  image:
    needs: checks
    # The server is linux/arm64; an x64-built image fails there with "exec format error".
    # Native arm runner instead of QEMU, which would crawl through the opus compile.
    runs-on: ubuntu-24.04-arm

    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      IMAGE: discord-bot:${{ github.sha }}
      ARCHIVE: discord-bot.tar.zst

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod-runner
          # Pinned so a runner change cannot silently ship the wrong architecture.
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}
            discord-bot:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ env.DEPLOY == 'true' && format('type=docker,dest={0}/discord-bot.tar', github.workspace) || 'type=cacheonly' }}

      # Before Twingate, so apt does not go through its DNS.
      # zstd too: the arm runner image ships fewer tools than the x64 one.
      - name: Install pv and zstd
        if: env.DEPLOY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pv zstd

      - name: Compress the image
        if: env.DEPLOY == 'true'
        run: |
          zstd -T0 -9 --rm -o "$ARCHIVE" discord-bot.tar
          ls -lh "$ARCHIVE"

      - uses: twingate/github-action@v1.5
        if: env.DEPLOY == 'true'
        with:
          service-key: ${{ secrets.SERVICE_KEY }}

      - name: Configure SSH
        if: env.DEPLOY == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # accept-new: same trust model as appleboy/* without `fingerprint`.
          # ServerAlive*: drop a dead connection instead of hanging on it.
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USERNAME
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      # Streams the archive straight into `docker load`, no temp file on the server.
      - name: Send and load the image
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          # Prints "<seconds> <percent>" every 10s, so a stalled transfer is visible in the log.
          pv -f -n -t -i 10 "$ARCHIVE" \
            | ssh server 'if command -v zstd >/dev/null 2>&1; then zstd -dc | docker load; else docker load; fi'

      - name: Restart the container
        if: env.DEPLOY == 'true'
        run: |
          ssh server bash -s -- "$IMAGE" <<'EOF'
          set -euo pipefail
          IMAGE="$1"

          docker rm -f discord-bot >/dev/null 2>&1 || true
          docker run -d \
            --name discord-bot \
            --restart unless-stopped \
            --env-file ~/dcbot/.env \
            "$IMAGE"

          # Keep the tag of the running version and `latest`, drop older ones.
          docker images discord-bot --format '{{.Tag}}' \
            | grep -vx -e "${IMAGE#*:}" -e latest \
            | xargs -r -I{} docker rmi -f "discord-bot:{}" || true
          docker image prune -f

          # Leftover from the old scp-based deploy.
          rm -f ~/dcbot/discord-bot.tar.zst
          EOF
